<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="portalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Icon Container with smooth rounded corners -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#portalGrad)" filter="url(#portalGlow)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />

  <!-- Outer Geometric Hexagon (Clipan Portal Hub) -->
  <polygon points="32,15 47,23.6 47,40.4 32,49 17,40.4 17,23.6" 
           stroke="#ffffff" 
           stroke-width="3" 
           stroke-linejoin="round" 
           fill="rgba(255,255,255,0.18)" />

  <!-- Inner Core Diamond -->
  <polygon points="32,24 38,32 32,40 26,32" 
           fill="#ffffff" />
</svg>